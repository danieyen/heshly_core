version: "3.9"

services:

  heshly:

    build:
      context: .
      dockerfile: Dockerfile.production

    container_name: heshly-production

    restart: unless-stopped

    ports:
      - "8000:8000"
      - "80:80"
      - "443:443"

    environment:
      HESHLY_ENV: production
      DATABASE_URL: mysql://mysql/heshly
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO

    depends_on:
      - mysql
      - redis

    networks:
      - heshly-network

  mysql:

    image: mariadb:11

    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: heshly

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - heshly-network

  redis:

    image: redis:7-alpine

    restart: unless-stopped

    volumes:
      - redis-data:/data

    networks:
      - heshly-network

volumes:

  mysql-data:

  redis-data:

networks:

heshly-network:

    nginx:

    image: nginx:latest

    container_name: heshly-nginx

    restart: unless-stopped

    ports:
      - "80:80"

    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - heshly

    networks:
      - heshly-network

    volumes:
     - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
     - ./deployment/nginx/ssl.conf:/etc/nginx/conf.d/ssl.conf:ro
     - ./deployment/ssl:/etc/nginx/ssl:ro     